<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finger Guider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="titleScreen">
    <h1 id="titleLogo">Finger Guider</h1>
    <div id="titleButtons">
      <button id="startInteractionBtn" class="titleBtn">インタラクションモード</button>
      <button id="startInsectBtn" class="titleBtn">虫食いモード</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <video id="camera" width="320" height="180" playsinline></video>
    <div id="cameraTrackZone"></div>
    <canvas id="canvas"></canvas>
    <button id="modeBtn">🖱 マウスモード</button>
    <div id="countCtrl">
      <button id="decBtn">−</button>
      <span id="countDisplay">1</span>
      <button id="incBtn">＋</button>
    </div>
    <button id="modelBtn">ダンゴムシ</button>
    <button id="backToTitleBtn">← Topに戻る</button>
    <div id="ui">
      <p id="uiText">マウスをドラッグして線を引いてみよう</p>
    </div>
    <div id="previewFrame"><span id="previewLabel">プレビュー</span></div>
  </div>

  <div id="insectScreen" class="hidden">
    <video id="insectCam" playsinline></video>
    <canvas id="insectCanvas"></canvas>
    <p id="insectHint">顔を映すとダンゴムシが群がる…📷で撮影</p>
    <button id="captureBtn">📷</button>
    <button id="insectBackBtn">← Topに戻る</button>

    <div id="cutin" class="hidden">
      <div id="cutinBand">
        <img id="cutinImg" class="hidden" alt="">
        <span id="cutinFace">😋</span>
        <span id="cutinText">いっただっきま〜す！</span>
      </div>
    </div>

    <div id="resultOverlay" class="hidden">
      <img id="resultImg" alt="虫食い写真">
      <div id="resultButtons">
        <button id="downloadBtn" class="resultBtn">⬇ ダウンロード</button>
        <button id="skipBtn" class="resultBtn ghost">戻る</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
